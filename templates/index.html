<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant</title>
    <style>
        :root {
            --bg-color: #f7f7f8;
            --card-bg: #ffffff;
            --text-color: #333333;
            --user-bubble: #007bff;
            --ai-bubble: #e9ecef;
            --border-color: #dee2e6;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            justify-content: space-between;
        }

        header {
            background-color: var(--card-bg);
            padding: 1rem;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            font-weight: 600;
            font-size: 1.1rem;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-width: 700px;
            width: 100%;
            margin: 0 auto;
            box-sizing: border-box;
        }

        .message {
            padding: 0.8rem 1.2rem;
            border-radius: 1rem;
            max-width: 80%;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .user-message {
            background-color: var(--user-bubble);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 0.2rem;
        }

        .ai-message {
            background-color: var(--ai-bubble);
            color: var(--text-color);
            align-self: flex-start;
            border-bottom-left-radius: 0.2rem;
        }

        .input-form-container {
            background-color: var(--card-bg);
            border-top: 1px solid var(--border-color);
            padding: 1rem;
            display: flex;
            justify-content: center;
        }

        form {
            display: flex;
            max-width: 700px;
            width: 100%;
            gap: 0.5rem;
        }

        input[type="text"] {
            flex: 1;
            padding: 0.8rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--user-bubble);
        }

        button {
            background-color: var(--user-bubble);
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 0.5rem;
            font-size: 1rem;
            cursor: pointer;
            font-weight: 500;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <header>Gemini AI Assistant </header>

    <div class="chat-container" id="chatContainer">
        <!-- Display user prompt if it exists -->
        {% if prompt %}
            <div class="message user-message">
                <strong>You:</strong> {{ prompt }}
            </div>
        {% endif %}

        <!-- Display AI response if it exists -->
        {% if response %}
            <div class="message ai-message">
                <strong>AI:</strong> {{ response }}
            </div>
        {% else %}
            <div class="message ai-message" style="color: #6c757d; font-style: italic;">
                Type a message below and hit send!
            </div>
        {% endif %}
    </div>

    <div class="input-form-container">
        <!-- Changed method to POST -->
        <form action="/" method="POST" id="chatForm">
            <input type="text" id="userInput" name="userInput_ai" placeholder="Type your message here..." autocomplete="off" required>
            <button type="submit" id="sendBtn">Send</button>
        </form>
    </div>

    <script>
        const chatContainer = document.getElementById("chatContainer");
        chatContainer.scrollTop = chatContainer.scrollHeight;

        document.getElementById("chatForm").addEventListener("submit", function() {
            const sendBtn = document.getElementById("sendBtn");
            sendBtn.disabled = true;
            sendBtn.textContent = "Thinking...";
        });
    </script>
</body>
</html>
